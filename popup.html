<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANGEL</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --accent: #ff4757;
      --accent-glow: rgba(255, 71, 87, 0.4);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
      --border: rgba(255, 255, 255, 0.1);
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo-container {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 71, 87, 0.1);
      border-radius: 12px;
      overflow: hidden;
    }

    .logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff, #a5b1c2);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
    }

    /* Status */
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ed573;
      box-shadow: 0 0 12px rgba(46, 213, 115, 0.6);
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      border: 1px solid rgba(46, 213, 115, 0.3);
      animation: pulse 2s infinite;
    }

    .status-dot.inactive {
      background: #ffa502;
      box-shadow: none;
    }

    .status-dot.inactive::after {
      border-color: rgba(255, 165, 2, 0.3);
      animation: none;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    /* Shortcuts Grid */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .item:hover {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .action {
      font-size: 12px;
      color: var(--text-dim);
    }

    .key {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(255, 71, 87, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 20px;
      text-align: center;
    }

    /* Features List */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px;
      background: var(--surface);
      border-radius: 10px;
      text-align: center;
    }

    .feature-icon {
      width: 20px;
      height: 20px;
      fill: var(--text);
      opacity: 0.8;
    }

    .feature-text {
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .version {
      font-size: 10px;
      color: var(--text-dim);
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(46, 213, 115, 0.1);
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      color: #2ed573;
    }

    .badge svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo-container">
      <img class="logo" src="icons/icon48.png" alt="ANGEL">
    </div>
    <div class="title-group">

      <div class="subtitle">A Natural Experience for Looking</div>
    </div>
  </div>

  <div class="features">

    <div class="feature">

  </div>

  <div class="footer">
    <div class="version" id="version-text">Version</div>
    <div class="badge">

  <script src="popup.js"></script>
</body>

</html>
